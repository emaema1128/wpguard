# /etc/modsecurity/wpguard.conf — WordPress 用の設定 (WPGuard)
# Debian の security2.conf により、CRS より先に読み込まれます。

# CRS の WordPress 向け除外ルール (投稿の保存やブロックエディタの誤検知を減らす)
SecAction "id:900130,phase:1,nolog,pass,t:none,setvar:tx.crs_exclusions_wordpress=1"

# 送れるデータの上限
#   ファイル以外: 初期値の 128KB では、ページビルダー (Elementor など) の保存が遮断される
#   ファイルを含む: PHP の upload_max_filesize / post_max_size に合わせる
SecRequestBodyNoFilesLimit 2097152
SecRequestBodyLimit 67108864

# 日本語 (UTF-8) の文章の誤検知を外す
#   941310: 古い文字コード (US-ASCII の 7 ビット化) を悪用した XSS を探すルール。
#           「コード例」「メール便」のように、日本語の普通の言葉で 403 になる。
#           今のブラウザはこの文字コードを使わないため、外しても危険は小さい。
SecAction "id:1000010,phase:1,nolog,pass,t:none,ctl:ruleRemoveById=941310"
